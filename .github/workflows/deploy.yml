name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:  # Permette deploy manuale dalla UI di GitHub

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: � Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/google_compute_engine -N ""
          chmod 600 ~/.ssh/google_compute_engine
      
      - name: 🚀 Deploy to VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          gcloud compute ssh ${VM_USER}@${VM_NAME} \
            --project=${GCP_PROJECT} \
            --zone=${GCP_ZONE} \
            --tunnel-through-iap \
            --ssh-key-file=~/.ssh/google_compute_engine \
            --command="
              set -e
              
              echo '👤 Current user:'
              whoami
              echo '📂 Navigating to deployment directory...'
              cd ${DEPLOY_PATH}
              
              echo '🔄 Pulling latest changes...'
              git pull origin main || git pull origin master
              
              echo '📦 Installing dependencies...'
              npm install --production
              
              echo '🔧 Restarting PM2 process...'
              if pm2 describe subito-notifier > /dev/null 2>&1; then
                echo '♻️  PM2 process exists, restarting...'
                pm2 restart subito-notifier
                pm2 save
              else
                echo '🆕 First deployment, starting PM2...'
                pm2 start ecosystem.config.js
                pm2 save
                pm2 startup
              fi
              
              echo '✅ Deployment completed successfully!'
              pm2 status
            "
      
      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "✅ **Deployment Successful**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🖥️  VM: \`${{ secrets.GCP_VM_NAME }}\` (via IAP)" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️  Project: \`${{ secrets.GCP_PROJECT }}\`" >> $GITHUB_STEP_SUMMARY
      
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ **Deployment Failed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
