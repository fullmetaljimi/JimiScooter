name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:  # Permette deploy manuale dalla UI di GitHub

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 🚀 Deploy to VM via gcloud compute ssh
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }} \
            --command="
              set -e
              echo '📂 Navigating to deployment directory...'
              cd ${{ secrets.DEPLOY_PATH }}
              echo '🔄 Pulling latest changes...'
              git pull origin main || git pull origin master
              echo '📦 Installing dependencies...'
              npm install --production
              echo '🔧 Restarting PM2 process...'
              if pm2 describe subito-notifier > /dev/null 2>&1; then
                echo '♻️  PM2 process exists, restarting...'
                pm2 restart subito-notifier
                pm2 save
              else
                echo '🆕 First deployment, starting PM2...'
                pm2 start ecosystem.config.js
                pm2 save
              fi
              echo '✅ Deployment completed!'
              pm2 status
            " \
            --tunnel-through-iap
          ENDSSH
      
      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "✅ **Deployment Successful**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🖥️  VM: \`${{ secrets.VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
      
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ **Deployment Failed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
